<?xml version="1.0" encoding="UTF-8"?>
<!--
  Extraspace app icon: a desktop monitor with a tablet standing beside it, which
  is literally what the app does.

  Drawn on the 128px GNOME app-icon canvas with the artwork inset to leave the
  margin the HIG expects, so it does not crowd its neighbours in the app grid.
  Shapes are kept chunky on purpose: this has to stay legible at 16px in a
  window list, where thin strokes disappear.

  Note for editors: a double hyphen is illegal inside an XML comment, so do not
  use one here as an em dash. librsvg rejects the whole file if you do, and the
  icon silently falls back to a generic one.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62A0EA"/>
      <stop offset="1" stop-color="#1C71D8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- Desktop monitor -->
  <rect x="22" y="34" width="58" height="40" rx="5" fill="#FFFFFF"/>
  <rect x="28" y="40" width="46" height="28" rx="2" fill="#1C71D8" opacity="0.45"/>
  <path d="M42 74 h18 l3 11 h-24 z" fill="#FFFFFF"/>
  <rect x="34" y="85" width="34" height="5" rx="2.5" fill="#FFFFFF"/>

  <!-- The tablet: the "extra space". Portrait and overlapping, so it reads as a
       second, different display rather than a copy of the monitor. -->
  <rect x="76" y="46" width="30" height="46" rx="5" fill="#FFFFFF"/>
  <rect x="81" y="52" width="20" height="34" rx="2" fill="#1C71D8" opacity="0.45"/>
  <circle cx="91" cy="89" r="1.8" fill="#1C71D8" opacity="0.6"/>
</svg>
